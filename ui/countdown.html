<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="countdown.css">
  <script src="countdown.js" defer></script>
  <link rel="stylesheet" href="quests.css">
  <script src="quests.js" defer></script>
  <title>SUIMAG · クエストボード</title>
</head>
<body>
  <aside id="daily-countdown" hidden aria-label="デイリー更新" role="timer" aria-live="off">
    <div class="copy">
      <span class="label">デイリー更新まで</span>
      <span id="reset-label"></span>
    </div>
    <strong id="remaining">00:00:00</strong>
  </aside>
  <main id="quest-app" hidden role="dialog" aria-modal="true" aria-label="クエストボード">
    <nav class="rail"><span class="brand">S<span>Q</span></span><span class="rail-mark">◈</span><span class="rail-caption">FLECITY</span></nav>
    <section class="workspace" tabindex="-1">
      <header>
        <h1>クエストボード</h1>
        <div class="header-actions"><button id="preferences" class="text-button">クエスト抽選設定</button><button id="close" class="icon-button" aria-label="閉じる">✕</button></div>
      </header>
      <div class="toolbar"><div class="tabs" aria-label="クエストの期間"><button data-period="daily">デイリー</button><button data-period="weekly">ウィークリー</button></div><button id="refresh" class="text-button">進捗を更新</button></div>
      <p id="reset-copy" class="reset-copy"></p>
      <p id="gui-status" class="status-message" role="status" aria-atomic="true"></p>
      <p id="gui-error" role="status"></p>
      <div class="section-heading"><h2 id="section-title" tabindex="-1"></h2><p id="completion"></p></div>
      <p id="board-note" class="board-note"></p>
      <div id="bonus" hidden></div>
      <div id="quest-cards"></div>
      <footer>ESC で閉じる</footer>
    </section>
  </main>
</body>
</html>
