<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="countdown.css">
  <script src="countdown.js" defer></script>
  <link rel="stylesheet" href="quests.css">
  <script src="quests.js" defer></script>
  <title>SUIMAG · クエストボード</title>
</head>
<body>
  <aside id="daily-countdown" hidden aria-label="デイリー更新" role="timer" aria-live="off">
    <div class="copy">
      <span class="label">デイリー更新まで</span>
      <span id="reset-label"></span>
    </div>
    <strong id="remaining">00:00:00</strong>
  </aside>
  <main id="quest-app" hidden role="dialog" aria-modal="true" aria-label="クエストボード">
    <nav class="rail"><span class="brand">S<span>Q</span></span><span class="rail-mark">◈</span><span class="rail-caption">FLECITY</span></nav>
    <section class="workspace" tabindex="-1">
      <header><div><p class="eyebrow">YOUR CITY. YOUR NEXT CHALLENGE.</p><h1>クエストボード<span>QUEST BOARD</span></h1></div><button id="close" class="icon-button" aria-label="閉じる">✕</button></header>
      <div class="intro"><div><span class="live-dot"></span> 小さな挑戦で、街の日常をもっと楽しく。</div><button id="preferences" class="text-button">⚙ 抽選設定</button></div>
      <div class="toolbar"><div class="tabs" aria-label="クエストの期間"><button data-period="daily">デイリー <small>DAILY</small></button><button data-period="weekly">ウィークリー <small>WEEKLY</small></button></div><button id="refresh" class="text-button">↻ 進捗を更新</button></div>
      <div class="section-heading"><div><p class="eyebrow" id="period-label"></p><h2 id="section-title"></h2></div><p id="completion"></p></div>
      <p id="board-note" class="board-note"></p><div id="quest-cards"></div><div id="bonus"></div>
      <footer><span id="reset-copy"></span><span>ESC で閉じる</span></footer>
      <p id="gui-error" role="status"></p>
    </section>
  </main>
</body>
</html>
