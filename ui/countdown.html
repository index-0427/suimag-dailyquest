<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="countdown.css">
  <script src="countdown.js" defer></script>
  <link rel="stylesheet" href="quests.css">
  <script src="quests.js" defer></script>
  <title>SUIMAG · クエストボード</title>
</head>
<body>
  <aside id="daily-countdown" hidden aria-label="デイリー更新" role="timer" aria-live="off">
    <div class="copy">
      <span class="label">デイリー更新まで</span>
      <span id="reset-label"></span>
    </div>
    <strong id="remaining">00:00:00</strong>
  </aside>
  <main id="quest-app" hidden role="dialog" aria-modal="true" aria-label="クエストボード">
    <aside class="rail" aria-label="Flecity"><span class="brand">S<span>Q</span></span><span class="rail-mark" aria-hidden="true"></span><span class="rail-caption">FLECITY</span></aside>
    <section class="workspace" tabindex="-1">
      <header><div class="heading-copy"><h1>クエストボード</h1><p class="header-description">街でのひとときを、達成と報酬に。</p></div><div class="header-actions"><button id="preferences" class="secondary-button" data-icon="settings">クエスト抽選設定</button><button id="close" class="icon-button" data-icon="close" aria-label="閉じる" title="閉じる（Esc）"></button></div></header>
      <p id="gui-status" class="status-message" role="status" aria-atomic="true"></p>
      <p id="gui-error" role="status"></p>
      <div id="board-view">
        <div class="toolbar"><div class="tabs" aria-label="クエストの期間"><button data-period="daily" data-icon="sun">デイリー</button><button data-period="weekly" data-icon="calendar">ウィークリー</button></div><button id="refresh" class="secondary-button" data-icon="refresh">進捗を更新</button></div>
        <p id="reset-copy" class="reset-copy"></p>
        <div class="board-overview">
          <div class="board-intro">
            <div class="section-heading"><h2 id="section-title" tabindex="-1"></h2><p id="completion"></p></div>
            <p id="board-note" class="board-note"></p>
          </div>
          <div id="bonus" hidden></div>
        </div>
        <div id="quest-cards"></div>
        <footer><span>自分のペースで、ひとつずつ。</span><span><kbd>Esc</kbd> で閉じる</span></footer>
      </div>
      <form id="preferences-view" hidden aria-labelledby="preferences-title">
        <p class="eyebrow" id="preferences-kicker">遊び方に合わせて</p>
        <h2 id="preferences-title" tabindex="-1">クエスト抽選設定</h2>
        <p class="preferences-intro">遊び方に合わせて、抽選から外したいクエストを選んでください。</p>
        <fieldset id="preferences-fields">
          <legend>チェックを入れた種類を、抽選から除外します</legend>
          <div class="preference-options">
            <label class="preference-option" id="crime-option">
              <input id="exclude-crime" type="checkbox" aria-describedby="crime-description">
              <span class="preference-copy"><strong>犯罪クエストを除外する</strong><span id="crime-description">家強盗・ブースティングなど、犯罪に関わるクエストが対象です。</span><span class="choice-state" id="crime-state"></span></span>
            </label>
            <label class="preference-option" id="employment-option">
              <input id="exclude-employment" type="checkbox" aria-describedby="employment-description">
              <span class="preference-copy"><strong>職業・所属必須クエストを除外する</strong><span id="employment-description">特定の職業への所属が必要な勤務クエストなどが対象です。無所属でも参加できる仕事は含みません。</span><span class="choice-state" id="employment-state"></span></span>
            </label>
          </div>
        </fieldset>
        <div class="preferences-summary" role="status"><span>抽選に含める種類</span><strong id="preferences-summary"></strong></div>
        <p class="preferences-help">一般クエストは常に候補に含まれます。職業・所属必須クエストを含めても、所属条件などを満たさないものは抽選されません。</p>
        <div class="preferences-timing"><strong>設定が反映されるタイミング</strong><p id="preferences-timing"></p></div>
        <div class="preferences-actions"><button id="preferences-cancel" class="secondary-button" type="button">保存せず戻る</button><button id="preferences-save" class="action-button" type="submit">設定を保存</button></div>
      </form>
    </section>
  </main>
</body>
</html>
